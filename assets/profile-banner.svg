<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">David De Santiago — engineering with great responsibility</title>
  <desc id="desc">An original comic-book-inspired engineering banner in red, blue, black, and white with webs and abstract mask lenses.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070d"/><stop offset="1" stop-color="#081a3a"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2d3f"/><stop offset="1" stop-color="#b80820"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#fff" opacity=".14"/></pattern>
    <filter id="shadow"><feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000" flood-opacity=".65"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1200" height="420" rx="26"/></clipPath>
  </defs>
  <style>
    .web{animation:web 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.eye{animation:eye 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.cursor{animation:blink 1s steps(1) infinite}
    @keyframes web{50%{opacity:.55;transform:scale(1.025)}}@keyframes eye{50%{filter:drop-shadow(0 0 10px #8cc8ff);transform:scale(1.025)}}@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <path d="M760-40L1260-40V460H970L690 240Z" fill="url(#red)"/>
    <path d="M825-20L1200-20V420H1035L760 215Z" fill="url(#dots)"/>
    <path d="M0 342L690 286L784 420H0Z" fill="#0d47a1" opacity=".72"/>
    <path d="M0 366L770 306" stroke="#ff3048" stroke-width="6"/>

    <g class="web" fill="none" stroke="#fff" stroke-opacity=".72">
      <path d="M1030 192L1030 5M1030 192L1160 62M1030 192L1210 192M1030 192L1160 322M1030 192L1030 410M1030 192L900 322M1030 192L850 192M1030 192L900 62" stroke-width="2"/>
      <path d="M980 142Q1030 118 1080 142Q1102 192 1080 242Q1030 266 980 242Q958 192 980 142Z"/>
      <path d="M940 102Q1030 62 1120 102Q1160 192 1120 282Q1030 322 940 282Q900 192 940 102Z"/>
      <path d="M900 62Q1030 5 1160 62Q1218 192 1160 322Q1030 379 900 322Q842 192 900 62Z"/>
    </g>

    <!-- Original abstract lenses: superhero energy without copied character artwork -->
    <g class="eye" filter="url(#glow)">
      <path d="M860 128Q925 118 982 159Q936 215 874 220Q848 177 860 128Z" fill="#f8fafc" stroke="#05070d" stroke-width="12"/>
      <path d="M1078 159Q1135 118 1200 128Q1212 177 1186 220Q1124 215 1078 159Z" fill="#f8fafc" stroke="#05070d" stroke-width="12"/>
      <path d="M870 145Q925 138 962 163Q929 195 891 201Q873 175 870 145Z" fill="#8cc8ff" opacity=".65"/>
      <path d="M1098 163Q1135 138 1190 145Q1187 175 1169 201Q1131 195 1098 163Z" fill="#8cc8ff" opacity=".65"/>
    </g>

    <g filter="url(#shadow)">
      <text x="64" y="86" fill="#ff3048" font-family="ui-monospace,Consolas,monospace" font-size="20" font-weight="700">ISSUE #01  •  THE ENGINEER NEXT DOOR</text>
      <text x="64" y="165" fill="#fff" stroke="#05070d" stroke-width="5" paint-order="stroke" font-family="Impact,Arial Black,sans-serif" font-size="66" letter-spacing="2">DAVID DE SANTIAGO</text>
      <text x="64" y="222" fill="#b8d8ff" font-family="ui-monospace,Consolas,monospace" font-size="23">SOFTWARE  //  SYSTEMS  //  INFRASTRUCTURE</text>
    </g>
    <g transform="translate(64 258) rotate(-2)">
      <rect width="580" height="62" rx="4" fill="#fff" stroke="#05070d" stroke-width="5"/>
      <text x="24" y="40" fill="#05070d" font-family="Impact,Arial Black,sans-serif" font-size="27" letter-spacing="1">WITH GREAT CODE COMES GREAT RESPONSIBILITY.</text>
    </g>
    <text x="66" y="374" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="17">BUILD → TEST → DOCUMENT → PROTECT THE USER</text>
    <rect class="cursor" x="530" y="357" width="11" height="22" fill="#ff3048"/>
  </g>
  <rect x="3" y="3" width="1194" height="414" rx="23" fill="none" stroke="#ff3048" stroke-width="6"/>
</svg>
