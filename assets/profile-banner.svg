<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">David De Santiago — your friendly neighborhood engineer</title>
  <desc id="desc">A dark red and navy technical banner with a terminal prompt and abstract web network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.58" stop-color="#0b1f45"/>
      <stop offset="1" stop-color="#121d3d"/>
    </linearGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff2438"/>
      <stop offset="0.72" stop-color="#e11d2e"/>
      <stop offset="1" stop-color="#67a9ff"/>
    </linearGradient>
    <radialGradient id="redglow">
      <stop stop-color="#ff3048" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ff3048" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8ab4ff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <style>
    .node { animation: pulse 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .web { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity:.4; transform:scale(.9) } 50% { opacity:1; transform:scale(1.2) } }
    @keyframes breathe { 0%,100% { opacity:.42 } 50% { opacity:.72 } }
    @keyframes blink { 0%,45% { opacity:1 } 46%,100% { opacity:0 } }
  </style>

  <rect width="1000" height="280" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="22" fill="url(#grid)"/>
  <circle cx="822" cy="140" r="220" fill="url(#redglow)"/>

  <!-- Abstract web: network architecture with a comic-inspired silhouette -->
  <g class="web" fill="none" stroke="#ff4053" stroke-linecap="round">
    <path d="M790 140L790 35M790 140L864 66M790 140L900 140M790 140L864 214M790 140L790 245M790 140L716 214M790 140L680 140M790 140L716 66" stroke-width="1.3" stroke-opacity=".68"/>
    <path d="M755 106Q790 90 825 106Q840 140 825 174Q790 190 755 174Q740 140 755 106Z" stroke-width="1" stroke-opacity=".62"/>
    <path d="M730 81Q790 55 850 81Q875 140 850 199Q790 225 730 199Q705 140 730 81Z" stroke-width="1" stroke-opacity=".48"/>
    <path d="M706 57Q790 20 874 57Q910 140 874 223Q790 260 706 223Q670 140 706 57Z" stroke-width="1" stroke-opacity=".34"/>
  </g>
  <g fill="#ff3048" filter="url(#glow)">
    <circle class="node" cx="790" cy="35" r="3.5"/>
    <circle class="node" cx="864" cy="66" r="3.5" style="animation-delay:.35s"/>
    <circle class="node" cx="900" cy="140" r="3.5" style="animation-delay:.7s"/>
    <circle class="node" cx="864" cy="214" r="3.5" style="animation-delay:1.05s"/>
    <circle class="node" cx="790" cy="245" r="3.5" style="animation-delay:1.4s"/>
    <circle class="node" cx="716" cy="214" r="3.5" style="animation-delay:1.75s"/>
    <circle class="node" cx="680" cy="140" r="3.5" style="animation-delay:2.1s"/>
    <circle class="node" cx="716" cy="66" r="3.5" style="animation-delay:2.45s"/>
    <circle class="node" cx="790" cy="140" r="5" style="animation-delay:.8s"/>
  </g>

  <text x="64" y="67" fill="#ff4053" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">$ identify --hero</text>
  <text x="64" y="126" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="42" font-weight="700">David De Santiago</text>
  <rect x="64" y="147" width="500" height="3" rx="2" fill="url(#redline)"/>
  <text x="64" y="190" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">software • systems • infrastructure</text>
  <text x="64" y="229" fill="#ff4053" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">your friendly neighborhood engineer</text>
  <rect class="cursor" x="389" y="214" width="9" height="19" fill="#67a9ff"/>
</svg>
